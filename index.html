<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中医学基礎理論 かんたん学習帳</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef1ec;--sf:#fbfcfa;--tx:#1c2826;--mu:#5d6b67;--ln:#d3dad5;--ac:#2f6b5e;--ac2:#e3eee9;--wood:#4f8a5b;--fire:#c8503c;--earth:#b8902f;--metal:#7d8794;--water:#3d5a80;--hd:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;--bd:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121917;--sf:#1b2522;--tx:#e6ece9;--mu:#9aaaa5;--ln:#2e3a36;--ac:#6fc2ad;--ac2:#22332e;--metal:#a3adb9;--water:#6d93c4;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.75 var(--bd);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
header{padding:22px 18px 8px;max-width:760px;margin:0 auto}
h1{font:700 26px/1.3 var(--hd);margin:0 0 4px;letter-spacing:.04em}
.sub{color:var(--mu);font-size:13px;margin:0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sf);border-bottom:1px solid var(--ln);display:flex;overflow-x:auto;gap:2px;padding:0 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:none;color:var(--mu);font:500 15px var(--hd);padding:12px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav button[aria-selected=true]{color:var(--ac);border-color:var(--ac);font-weight:700}
main{max-width:760px;margin:0 auto;padding:18px 16px 60px}
h2{font:700 22px/1.4 var(--hd);margin:0 0 6px}
h3{font:700 17px/1.5 var(--hd);margin:20px 0 8px}
p{margin:0 0 12px}
.lead{color:var(--mu);font-size:14.5px}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px 16px;margin:10px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:999px;padding:7px 14px;font:500 14px var(--bd);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:700}
details{background:var(--sf);border:1px solid var(--ln);border-radius:10px;margin:8px 0}
summary{cursor:pointer;padding:12px 16px;font:700 16px var(--hd);list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--ac);font-size:20px;line-height:1}
details[open] summary::after{content:"−"}
summary small{font:400 13px var(--bd);color:var(--mu);flex:1;text-align:right}
details>div{padding:0 16px 14px;font-size:15px}
details ul,.box ul{margin:4px 0 0;padding-left:20px}
li{margin:3px 0}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{border-bottom:1px solid var(--ln);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--mu);font-weight:500;white-space:nowrap;width:5.5em}
.yy{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yy div{border-radius:10px;padding:12px 14px;font-size:14.5px}
.yang{background:#f6e4dc;color:#4a2a1f}.yin{background:#dde5ee;color:#1f2f45}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .yang{background:#3b2a24;color:#f2d8cc}:root:not([data-theme="light"]) .yin{background:#222e3d;color:#cfdcec}}
.yy b{font:700 18px var(--hd);display:block}
.tag{display:inline-block;font-size:12.5px;padding:1px 8px;border-radius:6px;background:var(--ac2);color:var(--ac);margin-right:4px}
#wheel{width:100%;max-width:380px;display:block;margin:6px auto}
#wheel text{font-family:var(--hd);font-weight:700}
.node{cursor:pointer}
.res{border-left:4px solid var(--ac);padding:10px 14px;background:var(--sf);border-radius:0 10px 10px 0;margin:10px 0;font-size:15px}
.q{font:700 18px/1.55 var(--hd);margin:12px 0}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:10px;font:15.5px var(--bd);cursor:pointer}
.opt.ok{border-color:#2e8b57;background:#e0f1e7;color:#12331f}.opt.ng{border-color:#c0392b;background:#f7e1de;color:#4a1812}
.next{background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:11px 22px;font:700 15px var(--bd);cursor:pointer;margin-top:8px}
.note{font-size:12.5px;color:var(--mu);border-top:1px solid var(--ln);margin-top:30px;padding-top:12px}
button:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.kana{font:400 12.5px var(--bd);color:var(--mu);margin-left:8px}
.tag.warn{background:#f7e1de;color:#7a2a20}
.row.sm{gap:6px;margin:6px 0 10px}.row.sm .chip{padding:5px 11px;font-size:13.5px}
a.hl{color:var(--ac);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.arw{text-align:center;color:var(--mu);font-size:18px;line-height:1;margin:2px 0}
.fcard{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;margin:8px 0}
.hinfo{margin:4px 0 10px;padding:8px 12px;background:var(--ac2);border-radius:8px;font-size:14.5px}.hinfo:empty{display:none}
.pbar{display:inline-block;width:90px;height:6px;background:var(--ln);border-radius:3px;vertical-align:middle;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ac)}
.tag.done{background:#e0f1e7;color:#1d5a36}
.next:disabled{opacity:.5;cursor:default}
ruby{ruby-position:over}rt{font-size:.6em;font-weight:400;color:var(--mu);letter-spacing:0}
</style>
</head>
<body>
<header>
<h1>中医学基礎理論 学習帳</h1>
<p class="sub">陰陽・八綱・気血水・臓腑・六淫・五行から、舌診・脈診・方剤・生薬まで。タップしながら学ぶ</p>
</header>
<nav id="nav" role="tablist"></nav>
<main id="main"></main>
<script>
const $=s=>document.querySelector(s);
const E={
木:{c:"--wood",z:"肝",f:"胆",o:"目",t:"筋",h:"爪",l:"涙",e:"怒",col:"青",fl:"酸",s:"春",q:"風",d:"東",n:"伸びやかに広がる性質。疏泄（気の巡りの調整）を司る肝と対応。"},
火:{c:"--fire",z:"心",f:"小腸",o:"舌",t:"脈",h:"面（顔色）",l:"汗",e:"喜",col:"赤",fl:"苦",s:"夏",q:"暑",d:"南",n:"温熱・上昇の性質。血脈を主り神（精神活動）を蔵す心と対応。"},
土:{c:"--earth",z:"脾",f:"胃",o:"口",t:"肉",h:"唇",l:"涎",e:"思",col:"黄",fl:"甘",s:"長夏",q:"湿",d:"中央",n:"万物を育む性質。運化（飲食物の消化吸収と運搬）を司る脾と対応。"},
金:{c:"--metal",z:"肺",f:"大腸",o:"鼻",t:"皮毛",h:"毛",l:"涕",e:"悲（憂）",col:"白",fl:"辛",s:"秋",q:"燥",d:"西",n:"収斂・粛降の性質。宣発粛降を司る肺と対応。"},
水:{c:"--water",z:"腎",f:"膀胱",o:"耳（二陰）",t:"骨",h:"髪",l:"唾",e:"恐（驚）",col:"黒",fl:"鹹",s:"冬",q:"寒",d:"北",n:"潤下・蔵する性質。精を蔵し水を主る腎と対応。"}};
const K=Object.keys(E);
const LB=[["z","五臓"],["f","五腑"],["o","五官"],["t","五体"],["h","五華"],["l","五液"],["e","五志"],["col","五色"],["fl","五味"],["s","五季"],["q","五気"],["d","五方"]];
const det=(t,s,b)=>`<details><summary>${t}<small>${s||""}</small></summary><div>${b}</div></details>`;
const S={};

S.yinyang=()=>{
const st={陽盛:["陽が過剰","実熱証","高熱、顔面紅潮、口渇・冷飲を好む、煩躁、便秘、尿が濃く少ない、舌紅・苔黄、脈数有力","陽盛則熱（実熱）。清熱瀉火の治法。"],
陰盛:["陰が過剰","実寒証","悪寒、四肢冷え、腹痛・温めて軽減しない、口渇なし、顔色蒼白、舌淡・苔白滑、脈沈遅","陰盛則寒（実寒）。温中散寒の治法。"],
陽虚:["陽が不足","虚寒証","冷え、寒がり、顔色白、倦怠、自汗、水様便・尿清長、舌淡胖、脈沈遅無力","陽虚則寒（虚寒）。温陽の治法。"],
陰虚:["陰が不足","虚熱証","午後の微熱・五心煩熱、盗汗、口乾、頬部紅潮、痩せ、舌紅少苔、脈細数","陰虚則熱（虚熱）。滋陰の治法。"]};
return `<h2>陰陽学説</h2><p class="lead">万物を対立する二つの側面で捉え、バランスの変化として生理・病理を理解する中医学の根本思想。</p>
<div class="yy"><div class="yang"><b>陽</b>天・日・昼・春夏<br>熱・明・動・上・外<br>気・機能・腑</div><div class="yin"><b>陰</b>地・月・夜・秋冬<br>寒・暗・静・下・内<br>血・物質・臓</div></div>
<h3>陰陽の4つの関係</h3>
${det("対立制約","陰陽が互いに抑え合う","昼（陽）が夜（陰）に移り、熱が寒を抑える。互いに牽制してバランスを保つ。")}
${det("互根互用","一方がなければ他方も成り立たない","陽は陰を基盤にし、陰は陽に生かされる。気（陽）は血（陰）に宿り、血は気に推されて巡る。")}
${det("消長平衡","増減しながらつり合う","一日・四季の移り変わりのように、陰が減れば陽が増える。正常な範囲での変動は健康の証。")}
${det("相互転化","極まれば反転する","寒極まれば熱を生じ、熱極まれば寒を生ず（例：高熱の末に四肢厥冷・ショック状態になる「真熱仮寒」）。")}
<h3>陰陽の失調をさわってみる</h3>
<div class="row" id="ypick">${Object.keys(st).map((k,i)=>`<button class="chip" aria-pressed="${i==0}" data-k="${k}">${k}</button>`).join("")}</div>
<div class="res" id="yres"></div>
<p class="lead">陽盛・陰盛は「邪気が強い」実証。陽虚・陰虚は「正気が足りない」虚証。見分けが治療の第一歩です。</p>`;};
S.yinyang.init=()=>{const st={陽盛:["陽が過剰","実熱証","高熱、顔面紅潮、口渇・冷飲を好む、煩躁、便秘、尿が濃く少ない、舌紅・苔黄、脈数有力","陽盛則熱。清熱瀉火の治法。"],陰盛:["陰が過剰","実寒証","悪寒、四肢冷え、腹痛（温めても楽にならない）、口渇なし、顔色蒼白、舌淡・苔白滑、脈沈遅","陰盛則寒。温中散寒の治法。"],陽虚:["陽が不足","虚寒証","冷え、寒がり、顔色白、倦怠、自汗、水様便・尿清長、舌淡胖、脈沈遅無力","陽虚則寒。温陽の治法。"],陰虚:["陰が不足","虚熱証","午後の微熱・五心煩熱、盗汗、口乾、頬部紅潮、痩せ、舌紅少苔、脈細数","陰虚則熱。滋陰の治法。"]};
const show=k=>{const a=st[k];$("#yres").innerHTML=`<span class="tag">${a[0]}</span><span class="tag">${a[1]}</span><p style="margin:8px 0 6px">${a[2]}</p><p style="margin:0"><b>${a[3]}</b></p>`;document.querySelectorAll("#ypick .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k==k))};
document.querySelectorAll("#ypick .chip").forEach(b=>b.onclick=()=>show(b.dataset.k));show("陽盛")};

S.hakko=()=>`<h2>八綱弁証</h2><p class="lead">病位・病性・邪正の勢いを8つの綱領で整理する診断の基本枠組み。総綱は「陰陽」。</p>
<table><tr><th>表裏</th><td>病位の深さ。表＝皮毛・肌表（外感初期）、裏＝臓腑</td></tr><tr><th>寒熱</th><td>病気の性質。寒証・熱証</td></tr><tr><th>虚実</th><td>正気と邪気の強弱。虚＝正気不足、実＝邪気過剰</td></tr><tr><th>陰陽</th><td>上の6つを統括。表・熱・実＝陽、裏・寒・虚＝陰</td></tr></table>
<h3>各ペアのポイント</h3>
${det("表証・裏証","病位","<ul><li><b>表証</b>：悪寒・発熱が同時、頭痛、身体痛、舌苔薄、脈浮。発病が急で経過が短い</li><li><b>裏証</b>：悪寒と発熱が別々（寒熱往来を含む）、臓腑症状が主体、脈沈</li><li><b>半表半裏</b>：往来寒熱、胸脇苦満（少陽病）</li></ul>")}
${det("寒証・熱証","病性","<ul><li><b>寒証</b>：寒がる・温を好む、口渇なし、尿清長、便溏、舌淡苔白、脈遅</li><li><b>熱証</b>：熱がる・冷を好む、口渇、尿黄、便秘、舌紅苔黄、脈数</li><li>真寒仮熱・真熱仮寒に注意。「喉の渇き・尿・舌」で本質を見極める</li></ul>")}
${det("虚証・実証","邪正の力関係","<ul><li><b>虚証</b>：疲れやすい、息切れ、自汗・盗汗、痛みは喜按（押すと楽）、舌淡嫩、脈無力。治法＝補</li><li><b>実証</b>：声高、腹満、痛みは拒按（押すと増悪）、舌苔厚、脈有力。治法＝瀉</li></ul>")}
${det("組み合わせ","寒熱×虚実など","<ul><li>実寒・実熱・虚寒・虚熱の4型</li><li>表寒・表熱、表虚・表実（例：桂枝湯証＝表虚、麻黄湯証＝表実）</li><li>寒熱錯雑、虚実挟雑（本虚標実）も臨床では多い</li></ul>")}`;

S.kiketsusui=()=>`<h2>気・血・津液</h2><p class="lead">生命活動を支える基本物質。気は陽（動かす力）、血・津液は陰（潤し養う物質）。</p>
<h3>気の5つの働き</h3>
<table><tr><th>推動</th><td>血・津液の運行、臓腑機能の推進、成長発育</td></tr><tr><th>温煦</th><td>体を温める。体温維持</td></tr><tr><th>防御</th><td>外邪の侵入を防ぎ、排除する（衛気）</td></tr><tr><th>固摂</th><td>血・津液・精が漏れ出ないよう保持する</td></tr><tr><th>気化</th><td>気・血・津液・精の相互変換</td></tr></table>
<p style="margin-top:10px">気の源：<b>先天の精</b>（腎）＋<b>水穀の精微</b>（脾胃）＋<b>清気</b>（肺）。</p>
${det("気の失調（4病態）","気虚・気滞・気逆・気陥","<ul><li><b>気虚</b>：倦怠、息切れ、自汗、声に力がない、舌淡、脈虚弱 → 補気</li><li><b>気滞</b>：脹痛（移動する）、ため息で軽減、ストレスで増悪 → 行気</li><li><b>気逆</b>：咳喘（肺）、嘔吐・げっぷ（胃）、頭痛・めまい・怒りやすい（肝気上逆）→ 降気</li><li><b>気陥</b>：内臓下垂、脱肛、慢性下痢、めまい（中気下陥）→ 昇提</li></ul>")}
${det("血","営養・滋潤・神志の基礎","<p>血は<b>心が主り、肝が蔵し、脾が統べる</b>。脾胃で作られた水穀の精微が心肺で赤く変化して生成。気は血の帥（そつ）、血は気の母。</p><ul><li><b>血虚</b>：顔色萎黄・蒼白、めまい、動悸、不眠、爪が割れる、月経量少、舌淡 → 補血</li><li><b>血瘀</b>：刺痛（固定）、拒按、暗紫色の舌・瘀斑、月経血に塊、脈渋 → 活血化瘀</li><li><b>血熱</b>：出血、発疹、舌絳、脈数 → 清熱涼血</li></ul>")}
${det("津液","体内の正常な水分の総称","<p>津（さらさら・体表を潤す）と液（粘稠・関節や脳を潤す）。脾の運化、肺の通調水道、腎の気化、三焦の通路で代謝される。</p><ul><li><b>津液不足</b>：口・咽・皮膚の乾燥、尿少、便秘（陰虚・燥証）</li><li><b>水湿・痰飲</b>：浮腫、身体が重い、水様便、痰が多い、舌胖大・歯痕、苔膩、脈滑。<b>脾虚生湿</b>が代表</li><li>湿が熱を帯びれば<b>湿熱</b>、凝縮すれば<b>痰</b>となる</li></ul>")}
${det("気・血・津液の関係","","<ul><li><b>気は血を生じ、血を行らせ、血を摂（おさ）める</b></li><li><b>血は気を載せ、気を養う</b></li><li>気虚→血虚、気滞→血瘀、気脱→亡血（大出血で気も脱す）</li><li><b>気は津液を化し、行らせ、摂める</b>。気虚→水腫、気滞→痰飲</li></ul>")}`;

S.zofu=()=>{const z=[["肝","胆","疏泄を主り血を蔵す。魂を宿し、筋・目・爪と関連","疏泄：気機の調節、情志の安定、脾胃の消化補助、胆汁分泌。蔵血：血量調節。","肝気鬱結（イライラ・脇肋部の脹痛）、肝血虚（目のかすみ・爪の異常）、肝陽上亢（めまい・頭痛）、肝風内動（痙攣）"],
["心","小腸","血脈を主り神明を主る。舌・面・汗と関連","血脈：血を全身に巡らせる。神明：意識・思考・睡眠など精神活動。","心気虚（動悸・息切れ）、心血虚（不眠・健忘）、心火上炎（口内炎・不眠）、心血瘀阻（胸痛）"],
["脾","胃","運化を主り、昇清し、統血する。肌肉・四肢・口唇と関連","運化：消化吸収と水湿の運搬。昇清：精微を上に送る。統血：血を脈内にとどめる。後天の本・気血生化の源。","脾気虚（食欲不振・軟便・倦怠）、脾陽虚（冷え・水様便）、湿困脾胃（身重・苔膩）、脾不統血（紫斑・不正出血）"],

S.gogyo.init=()=>{let mode="s",sel="木";const P={};K.forEach((k,i)=>{const a=-Math.PI/2+i*2*Math.PI/5;P[k]=[180+118*Math.cos(a),165+118*Math.sin(a)]});

$("#wheel").innerHTML=h;
$("#wheel").querySelectorAll(".node").forEach(n=>{n.onclick=()=>{sel=n.dataset.k;draw()};n.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){sel=n.dataset.k;draw()}}});

document.querySelectorAll("#gpick .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m==mode))};
document.querySelectorAll("#gpick .chip").forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw()});

draw()};

S.byori=()=>`<h2>各理論の病理</h2><p class="lead">病気は「正気（抵抗力）と邪気（病因）の闘い」の結果。ここでは各理論ごとに、病態がどう生じ、どう変わるかを整理します。</p>
<div class="box"><b>発病の基本</b><ul><li><b>正気不足</b>が発病の内因、<b>邪気</b>が外因</li><li>邪が勝てば発病、正が勝てば治癒。<b>邪正闘争</b>の勝敗で虚実が決まる</li><li>病因：外感（六淫）・内傷（七情・飲食・労倦）・病理産物（痰飲・瘀血）</li></ul></div>
${det("陰陽の病理","偏盛・偏衰・互損・格拒・亡失","<ul><li><b>陰陽偏盛</b>：陽盛→熱（実熱）、陰盛→寒（実寒）。陽盛は陰を傷り（陽盛則陰病）、陰盛は陽を傷る（陰盛則陽病）</li><li><b>陰陽偏衰</b>：陽虚→寒（虚寒）、陰虚→熱（虚熱）</li><li><b>陰陽互損</b>：陰が陽を、陽が陰を損なう（陰損及陽、陽損及陰）→ 陰陽両虚</li><li><b>陰陽格拒</b>：真熱仮寒（熱が極まり四肢厥冷）、真寒仮熱（内寒が陽を外に追い出す）</li><li><b>亡陰・亡陽</b>：大汗・大出血・激しい下痢で陰陽が急速に失われる危急状態。亡陽＝冷汗・四肢厥冷・脈微、亡陰＝熱い汗・口渇・脈細数</li></ul>")}
${det("八綱の病理","伝変・転化・真仮","<ul><li><b>表→裏</b>：邪が深く入る（外感病の悪化）。<b>裏→表</b>は病勢の好転</li><li><b>寒熱転化</b>：寒邪が鬱して熱化、熱が極まって陽気を損じ寒証に</li><li><b>寒熱錯雑</b>：上熱下寒（のぼせと足冷え）、上寒下熱など</li><li><b>虚実転化</b>：実→虚（邪が長引いて正気を消耗）、虚→実（気虚→気滞・痰湿、本虚標実）</li><li><b>真仮</b>：真寒仮熱・真熱仮寒、真虚仮実（脾虚の腹満）、真実仮虚（熱結の無気力）</li></ul>")}
${det("気血水の病理","単独の失調と同病","<ul><li><b>気</b>：気虚・気滞・気逆・気陥・気閉・気脱</li><li><b>血</b>：血虚・血瘀・血熱・血寒・出血</li><li><b>津液</b>：不足（燥）と停滞（水・湿・痰・飲）。脾・肺・腎・三焦の失調で生じる</li><li><b>気血同病</b>：気滞血瘀、気虚血瘀、気血両虚、気不摂血（出血）、気随血脱（大出血後の虚脱）</li><li><b>気と津液</b>：気虚→水腫、気滞→痰飲、気随津脱（大汗・下痢で気も失う）</li><li><b>病理産物</b>：痰・飲・水・湿・瘀血は二次的な病因となり、さらに病態を悪化させる</li></ul>")}
${det("臓腑の病理","五臓の代表病証","<table><tr><th>肝</th><td>疏泄失調→気鬱・気逆、蔵血失調→血虚、肝陽上亢、肝風内動、肝火上炎</td></tr><tr><th>心</th><td>血脈失調→心血瘀阻、神明失調→不眠・健忘・錯乱、心火上炎</td></tr><tr><th>脾</th><td>運化失調→食欲不振・泥状便・痰湿、昇清失調→気陥、統血失調→出血</td></tr><tr><th>肺</th><td>宣発失調→咳・鼻づまり、粛降失調→喘・息切れ、通調水道失調→水腫</td></tr><tr><th>腎</th><td>蔵精失調→発育・生殖障害、主水失調→浮腫・夜間尿、納気失調→喘息、腎陰虚・腎陽虚</td></tr></table><p style=\"margin-top:8px\"><b>臓腑同病</b>：心腎不交（不眠）、肝脾不和（ストレス性下痢）、肝胃不和（嘔気）、脾腎陽虚（五更泄瀉）、肺腎陰虚（乾咳・ほてり）、心脾両虚（動悸・倦怠）</p>")}
${det("六淫の病理","発病・伝変・転化","<ul><li><b>侵入経路</b>：口鼻・皮毛。六淫は単独でなく、風寒・風熱・風湿・暑湿など<b>合邪</b>で来ることが多い</li><li><b>転化</b>：寒邪が鬱して熱化、湿鬱化熱（湿熱）、熱極生風（高熱での痙攣）、燥熱傷津</li><li><b>内生五邪</b>：内風（肝陽化風・血虚生風）、内寒（陽虚）、内湿（脾虚生湿）、内燥（津液不足）、内火（陰虚火旺・気鬱化火）</li><li>外邪が体内に入ると<b>痰飲・瘀血</b>などの病理産物に変わり得る</li></ul>")}
${det("五行の病理","母子・乗侮","<ul><li><b>母病及子</b>：母の臓の病が子に及ぶ（腎陰虚→肝陰虚＝水不涵木）</li><li><b>子病犯母</b>：子の臓の病が母に及ぶ（心火旺→肝火旺）</li><li><b>相乗</b>：克が過剰（肝気が脾を犯す＝木乗土）。肝気の過剰か脾の虚弱が原因</li><li><b>相侮</b>：逆方向に克す（肝火が肺を侮る＝木火刑金、土虚水侮）</li><li>治療原則：<b>虚なら母を補い、実なら子を瀉す</b></li></ul>")}`;

QZ.push(['陰陽の「互根互用」を最もよく表す例は？',['昼が夜に変わる','気が血を生み、血が気を養う','熱が寒を抑える','高熱の末に四肢が冷える'],1,'互いに依存し合う関係。昼夜は消長、四肢の冷えは転化、熱が寒を抑えるのは対立制約です。','陰陽'],['「陽盛則熱」で生じる病態は？',['実熱','虚熱','虚寒','実寒'],0,'陽が過剰になると実熱証となります。虚熱は陰虚によるものです。','陰陽'],['真熱仮寒の説明として正しいのは？',['本質は寒で熱の症状が出る','本質は熱で寒の症状が出る','虚と実が混在する','表と裏が混在する'],1,'熱が極まり陽気が内に閉じ込められ、四肢厥冷など寒の仮象が出ます。','陰陽'],['寒証の特徴として正しいのは？',['口渇・冷飲を好む','尿が濃く少ない','口渇なし・温を好む','舌紅・黄苔'],2,'寒証は口渇がなく温かいものを好み、尿は清長、舌は淡で苔は白です。','八綱'],['「本虚標実」の意味は？',['根本は虚で、表面に実の症状が出る','根本は実で、表面は虚','表と裏の併病','寒熱が上下に分かれる'],0,'正気の不足を本とし、痰湿や瘀血などの実邪が標として現れる状態です。','八綱'],['気の防御作用を担う衛気が不足したとき起こりやすいのは？',['風邪をひきやすい','夜間尿','月経血の塊','舌の瘀斑'],0,'衛気は体表を守る気です。不足すると外邪を受けやすくなります。','気血水'],['血虚の症状として最も典型的なのは？',['固定した刺痛','顔色萎黄・めまい・爪の乾燥','高熱・口渇','腹部の冷痛'],1,'血が不足して栄養と滋潤ができなくなる状態です。刺痛は血瘀の症状です。','気血水'],['脾虚から生じやすい病理産物は？',['湿・痰','燥邪','瘀血のみ','内風'],0,'脾の運化が失調すると水湿が停滞し、痰湿を生じます（脾虚生湿）。','気血水'],['「疏泄」を主る臓は？',['肝','心','肺','腎'],0,'肝は疏泄で気の巡りを調節し、情志の安定や消化にも関わります。','臓腑'],['「納気」を主り、先天の本とされる臓は？',['脾','腎','肺','肝'],1,'腎は精を蔵し、吸入した気を受け止めて深く保ちます（納気）。','臓腑'],['「神明」を主る臓は？',['肺','脾','心','腎'],2,'心は血脈とともに精神・意識・思考を主ります。','臓腑'],['「湿邪」の特徴として正しいのは？',['重濁・粘滞','収引・凝滞','炎上・津液を消耗','乾燥・津液を傷る'],0,'湿は陰邪で、重く濁り粘って治りにくい性質です。収引は寒、炎上は火、乾燥は燥の性質です。','六淫'],['内生五邪に含まれないのは？',['内風','内寒','内暑','内湿'],2,'内生五邪は内風・内寒・内湿・内燥・内火です。暑は夏の外感のみで、内暑はありません。','六淫'],['相生の関係で「土」が生むのは？',['火','金','水','木'],1,'木→火→土→金→水の順で、土は金を生みます。','五行'],['「気随血脱」とは？',['大出血に伴い気も失われる','気滞から血瘀が生じる','気が血を摂められない','血が気を養う'],0,'気は血に宿るため、大出血で血とともに気も脱する危急の状態です。','病理'],['「母病及子」の例は？',['腎陰虚から肝陰虚','肝気が脾を犯す','肝火が肺を侮る','心火が腎を抑える'],0,'母（腎＝水）の病が子（肝＝木）に及ぶ例です。水不涵木とも呼びます。','病理'],['「上熱下寒」の例は？',['のぼせと足の冷え','発熱と悪寒','口渇と多尿','高熱と便秘'],0,'寒熱が上下に分かれる錯雑の病態です。','病理'],['舌尖に対応する臓腑は？',['腎','脾胃','肝胆','心肺'],3,'舌尖は上焦（心肺）、舌中は脾胃、舌辺は肝胆、舌根は腎・膀胱に対応します。','舌診'],['紅舌・少苔・裂紋が示す病態は？',['陰虚（虚熱）','湿熱','陽虚','寒湿'],0,'陰液が不足して舌を潤せず、虚熱が生じた状態です。','舌診'],['「滑脈」が示すことが多いのは？',['痰湿・食積','血虚','寒証','表証'],0,'玉が転がるような脈で、痰湿・食積に多く見られます。','脈診'],['左手の関部に対応するのは？',['肺・大腸','脾・胃','肝・胆','心・小腸'],2,'左は寸＝心、関＝肝胆、尺＝腎陰。右は寸＝肺、関＝脾胃、尺＝腎陽です。','脈診'],['補中益気湯が適する病態は？',['腎陽虚','中気下陥','三焦の実熱','表寒実'],1,'黄耆・人参・柴胡・升麻などで気を補い持ち上げ、内臓下垂や倦怠に用います。','方剤'],['桂枝茯苓丸が主に用いられる証は？',['瘀血','気虚','陰虚','風熱'],0,'桃仁・牡丹皮・芍薬などで瘀血を改善します。妊娠中は医師の確認が必要です。','方剤'],['倦怠・息切れ・自汗、舌は淡胖で歯痕、脈は虚弱。最も考えられる証は？',['気虚','肝火上炎','湿熱','血瘀'],0,'気の推動・固摂の低下による気虚です。治法は補気（例：四君子湯）。','弁証'],['冷え・夜間尿・腰膝の冷え、舌は淡胖、脈は沈遅無力。治法は？',['清肝瀉火','温補腎陽','活血化瘀','辛涼解表'],1,'腎陽虚の所見です。八味地黄丸などで腎陽を温めます。','弁証'],['ほてり・寝汗・口乾、舌紅少苔、脈細数。代表的な方剤は？',['六味丸','麻黄湯','五苓散','人参湯'],0,'陰虚（虚熱）に対し滋陰する六味丸などを考えます。','弁証']);

const HF={};HB.forEach(h=>HF[h.n]=[]);FL.forEach(f=>toks(f[1]).forEach(t=>hOf(t).forEach(h=>{if(!HF[h.n].includes(f[0]))HF[h.n].push(f[0])})));
const HLR=new RegExp([...FN,...HB.flatMap(h=>[h.n,...(h.al?h.al.split('|'):[])])].sort((a,b)=>b.length-a.length).join('|'),'g');
const hl=s=>s.replace(HLR,m=>hOf(m).length?`<a class='hl' data-h='${m}'>${m}</a>`:m);
const herbDet=h=>det(`${h.n}<span class='kana'>${h.k}</span>`,`${h.c}｜${h.q}`,`<p><span class='tag'>性味</span>${h.f}／${h.q}　<span class='tag'>帰経</span>${h.m}</p><p><span class='tag'>効能</span>${h.e}</p>${h.w?`<p><span class='tag warn'>注意</span>${h.w}</p>`:''}${HF[h.n].length?`<p style='margin:0'><span class='tag'>配合される方剤</span></p><div class='row sm' style='margin-top:4px'>${HF[h.n].map(f=>`<button class='chip' data-f='${f}'>${f}</button>`).join('')}</div>`:''}`);
const CATS=[...new Set(HB.map(h=>h.c))];

S.shoyaku=()=>`<h2>生薬の基礎</h2><p class='lead'>生薬の働きは「性（寒熱温涼）・味・帰経・昇降浮沈」で整理します。基本を読んでから、下の図鑑で${HB.length}種の生薬を性・味・帰経・分類で絞り込んでみましょう。</p>
${det('四気（四性）','寒・涼・平・温・熱',`<table><tr><th>寒・涼</th><td>清熱・瀉火・涼血・解毒。熱証に用いる（例：石膏・黄連）。寒は涼より作用が強い</td></tr><tr><th>温・熱</th><td>温裏・散寒・助陽・通脈。寒証に用いる（例：附子・乾姜）。熱は温より作用が強い</td></tr><tr><th>平</th><td>寒熱の偏りが少なく穏やか（例：茯苓・甘草）</td></tr></table><p style='margin-top:8px'>原則は「寒なる者は之を熱し、熱なる者は之を寒す」。性は、その生薬が体を冷やすか温めるかという作用の方向を表します。</p>`)}
${det('五味','辛・甘・酸・苦・鹹（＋淡・渋）',`<table><tr><th>辛</th><td>散・行：発散・行気・行血（麻黄・陳皮・川芎）</td></tr><tr><th>甘</th><td>補・和・緩：補益・調和・緩急止痛（人参・甘草）</td></tr><tr><th>酸</th><td>収・渋：汗・下痢・遺精を止める（五味子・山茱萸）</td></tr><tr><th>苦</th><td>泄・燥・堅：清熱・瀉下・降逆・燥湿・堅陰（黄連・大黄）</td></tr><tr><th>鹹</th><td>軟・下：軟堅散結・瀉下（芒硝）</td></tr><tr><th>淡</th><td>滲・利：滲湿利水（茯苓・猪苓）</td></tr><tr><th>渋</th><td>収斂。酸に近い（山茱萸）</td></tr></table><p style='margin-top:8px'>五味は五行で五臓と結びつきます（酸→肝、苦→心、甘→脾、辛→肺、鹹→腎）。</p>`)}
${det('昇降浮沈','作用の向き',`<ul><li><b>昇浮</b>（上へ・外へ）：辛・甘、温・熱の薬。花・葉など軽いもの。解表・升陽（麻黄・升麻・柴胡）</li><li><b>沈降</b>（下へ・内へ）：酸・苦・鹹、寒・涼の薬。種子・鉱物など重いもの。瀉下・利水・降逆・安神（大黄・芒硝・半夏）</li><li>加工で変わる：酒で炒ると上行、塩水で炒ると下行（腎に入る）</li></ul>`)}
${det('帰経','どの臓腑・経絡に効くか',`<p>生薬が主に作用する臓腑・経絡のことです。同じ働きの生薬でも、帰経の違いで使い分けます。</p><ul><li>清熱燥湿の三黄：<b>黄芩</b>＝肺（上焦）、<b>黄連</b>＝心・胃（中焦）、<b>黄柏</b>＝腎・膀胱（下焦）</li><li>補陰：<b>麦門冬</b>＝肺・胃・心、<b>天門冬</b>＝肺・腎</li><li>引経薬：桔梗は薬を上へ、牛膝は下へ導く</li></ul>`)}
${det('配伍（七情）','組み合わせの法則',`<table><tr><th>単行</th><td>1味だけで用いる（独参湯）</td></tr><tr><th>相須</th><td>似た働きの薬で効果を高める（石膏＋知母、大黄＋芒硝）</td></tr><tr><th>相使</th><td>主薬を補助薬が助ける（黄耆＋茯苓）</td></tr><tr><th>相畏</th><td>毒性が他の薬に抑えられる（半夏は生姜を畏れる）</td></tr><tr><th>相殺</th><td>他の薬の毒を消す（生姜は半夏の毒を殺す）</td></tr><tr><th>相悪</th><td>効果を互いに弱める（人参は萊菔子を悪む）</td></tr><tr><th>相反</th><td>併用で毒性・副作用が出る（十八反）</td></tr></table><p style='margin-top:8px'><b>十八反</b>：甘草は甘遂・大戟・海藻・芫花に反す／烏頭（附子の仲間）は半夏・瓜蔞・貝母・白蘞・白及に反す／藜蘆は人参・沙参・丹参・玄参・細辛・芍薬に反す。<b>十九畏</b>：人参は五霊脂を畏れる、など。根拠には議論もありますが、原則として避ける組み合わせです。</p>`)}
${det('君臣佐使と炮製','方剤の組み立てと加工',`<ul><li><b>君</b>（主病を治す）・<b>臣</b>（君を助ける）・<b>佐</b>（兼症や毒性を調える）・<b>使</b>（諸薬を調和・引経）</li><li>例：麻黄湯＝君・麻黄、臣・桂枝、佐・杏仁、使・甘草</li><li><b>炮製</b>（加工）で性質が変わる：生地黄（寒・清熱涼血）を蒸すと熟地黄（微温・補血）、附子は加工して減毒、甘草は炙ると補中の力が増す</li></ul>`)}
<h3>生薬図鑑</h3><input id='hq' type='search' placeholder='生薬名・読み・効能で検索（例：補気、地黄）' style='width:100%;padding:11px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx);font:16px var(--bd);margin:6px 0'>
<div class='box'><b>薬性</b><div class='row sm' id='h1'></div><b>五味</b><div class='row sm' id='h2'></div><b>帰経</b><div class='row sm' id='h3'></div><b>分類</b><div class='row sm' id='h4'></div></div><div id='hcnt' class='lead'></div><div id='hres'></div>`;
S.shoyaku.init=()=>{const st={q:'',f:'',m:'',c:''};const O={h1:['q',['寒','涼','平','温','熱']],h2:['f',['辛','甘','酸','苦','鹹','淡','渋']],h3:['m',['肝','心','脾','肺','腎','胃','胆','大腸','小腸','膀胱','三焦','心包']],h4:['c',CATS]};
const inp=$('#hq');let jump=false;if(PEND){inp.value=PEND;PEND='';jump=true}
const draw=()=>{Object.keys(O).forEach(id=>{const[k,vs]=O[id];$('#'+id).innerHTML=['',...vs].map(v=>`<button class='chip' data-v='${v}' aria-pressed='${st[k]==v}'>${v||'すべて'}</button>`).join('');$('#'+id).querySelectorAll('.chip').forEach(b=>b.onclick=()=>{st[k]=b.dataset.v;draw()})});
const s=inp.value.trim();const r=HB.filter(h=>(!st.q||QG(h.q)==st.q)&&(!st.f||h.f.split('・').map(x=>x.replace('微','')).includes(st.f))&&(!st.m||h.m.split('・').includes(st.m))&&(!st.c||h.c==st.c)&&(!s||[h.n,h.k,h.e,h.c,h.al].join(' ').includes(s)));
$('#hcnt').innerHTML=`該当：<b>${r.length}</b>種／全${HB.length}種`+(r.length?'':'（条件を緩めてください）');$('#hres').innerHTML=r.map(herbDet).join('');if(r.length&&r.length<=2)$('#hres').querySelectorAll('details').forEach(d=>d.open=true)};
inp.oninput=draw;draw();if(jump)setTimeout(()=>inp.scrollIntoView({block:'start'}),0)};

const EF=[['補気',/補気|益気|補中|元気|補脾/],['補血',/補血|養血/],['滋陰・生津',/滋陰|養陰|補陰|生津/],['温陽・補陽',/助陽|補火|補肝腎|回陽/],['温裏散寒',/温中|散寒|温通|温肺/],['清熱',/清熱|瀉火/],['涼血・止血',/涼血|止血/],['解表',/解表|解肌|散風|疏散風熱|発表/],['理気',/理気|行気|破気|下気|疏肝/],['活血化瘀',/活血|祛瘀|逐瘀|散瘀|化瘀/],['利水',/利水|利尿|滲湿/],['化湿・燥湿',/化湿|燥湿/],['化痰',/化痰|祛痰|消痰/],['止咳平喘',/止咳|平喘/],['止嘔・降逆',/止嘔|降逆/],['瀉下・通便',/瀉下|通便/],['安神',/安神|寧心/],['平肝熄風',/平肝|熄風|平抑肝陽/],['収渋・止汗',/収斂|収渋|斂汗|止汗|斂陰|固表|渋精/],['昇提',/升陽|升挙|升提/]];
const fIn=s=>{const used=[],hits=[];[...FN].sort((a,b)=>b.length-a.length).forEach(n=>{let i=s.indexOf(n);while(i>=0){const j=i+n.length;if(!used.some(([a,b])=>i<b&&j>a)){used.push([i,j]);hits.push([i,n])}i=s.indexOf(n,j)}});return hits.sort((a,b)=>a[0]-b[0]).map(x=>x[1])};
S.gyaku=()=>`<h2>逆引き</h2><p class='lead'>証から「治法 → 方剤 → 構成生薬」とたどるか、ほしい効能から生薬を探します。方剤と生薬の関係を、実際の証に結びつけて覚えましょう。</p><div class='row' id='gm'></div><div id='gbody'></div><p class='note'>方剤は代表例です。実際の処方は兼証・体質・製剤で変わります。</p>`;
S.gyaku.init=()=>{const st={md:'1',a:'',z:'',e:'',q:''};const AR=['表','気','血','水湿','肝','心','脾','肺','腎'];
const chips=(id,key,vals,lab)=>{$('#'+id).innerHTML=vals.map(v=>`<button class='chip' data-v='${v}' aria-pressed='${st[key]==v}'>${lab?lab(v):(v||'すべて')}</button>`).join('');$('#'+id).querySelectorAll('.chip').forEach(b=>b.onclick=()=>{st[key]=b.dataset.v;if(key=='a')st.z='';draw()})};
const draw=()=>{chips('gm','md',['1','2'],v=>v=='1'?'証 → 方剤 → 生薬':'効能 → 生薬');
if(st.md=='1'){$('#gbody').innerHTML=`<div class='box'><b>① 領域を選ぶ</b><div class='row sm' id='ga'></div><b>② 証を選ぶ</b><div class='row sm' id='gz'></div></div><div id='gout'></div>`;
chips('ga','a',['',...AR]);chips('gz','z',ZH.filter(z=>!st.a||z[3]==st.a).map(z=>z[0]));
const z=ZH.find(x=>x[0]==st.z);if(!z){$('#gout').innerHTML=`<p class='lead'>証を選ぶと、治法 → 方剤 → 構成生薬の順にたどれます。</p>`;return}
$('#gout').innerHTML=`<div class='res'><span class='tag'>証</span><b style='font:700 18px var(--hd)'>${z[0]}</b><span class='kana'>${z[1]=='平'?'':z[1]+'・'}${z[2]}／${z[3]}</span><p style='margin:6px 0 0'>${z[4]}</p><p style='margin:4px 0 0'><span class='tag'>舌</span>${z[5]}　<span class='tag'>脈</span>${z[6]}</p></div><div class='arw'>↓</div><div class='res' style='border-color:var(--earth)'><span class='tag'>治法</span><b style='font:700 18px var(--hd)'>${z[7]}</b></div><div class='arw'>↓</div><div class='res' style='border-color:var(--fire)'><span class='tag'>方剤</span>${z[8]}</div>`+fIn(z[8]).map(n=>{const f=FD[n];return `<div class='fcard'><b style='font:700 17px var(--hd)'>${n}</b><span class='kana'>${f[3]}</span><p style='margin:4px 0 6px;font-size:14.5px'>${f[2]}</p><div class='lead' style='margin:0;font-size:13px'>構成生薬（タップで性味・帰経・効能）</div><div class='row sm'>${toks(f[1]).map(t=>hOf(t).length?`<button class='chip' data-ih='${t}'>${t}</button>`:`<span class='chip' style='opacity:.55;cursor:default'>${t}</span>`).join('')}</div><div class='hinfo'></div><button class='chip' data-f='${n}' style='font-size:13px'>方剤タブで見る</button></div>`}).join('');
$('#gout').querySelectorAll('[data-ih]').forEach(b=>b.onclick=()=>{const c=b.closest('.fcard');c.querySelectorAll('[data-ih]').forEach(x=>x.setAttribute('aria-pressed',x==b));c.querySelector('.hinfo').innerHTML=hOf(b.dataset.ih).map(h=>`<b>${h.n}</b>（${h.k}）<span class='tag' style='margin-left:6px'>${h.c}</span><br>性味：${h.f}／${h.q}　帰経：${h.m}<br>効能：${h.e}${h.w?`<br><span class='tag warn'>注意</span>${h.w}`:''}<br><a class='hl' data-h='${h.n}'>生薬図鑑で見る</a>`).join(`<hr style='border:0;border-top:1px solid var(--ln)'>`)})}
else{$('#gbody').innerHTML=`<div class='box'><b>ほしい効能</b><div class='row sm' id='ge'></div><b>薬性で絞る</b><div class='row sm' id='gq'></div></div><div id='gcnt' class='lead'></div><div id='gout2'></div>`;
chips('ge','e',EF.map(x=>x[0]));chips('gq','q',['','寒','涼','平','温','熱']);
const ef=EF.find(x=>x[0]==st.e);if(!ef){$('#gcnt').innerHTML='効能を選ぶと、その働きをもつ生薬が出ます。薬性も合わせると、たとえば「清熱」で寒の生薬だけに絞れます。';$('#gout2').innerHTML='';return}
const r=HB.filter(h=>ef[1].test(h.e)&&(!st.q||QG(h.q)==st.q));$('#gcnt').innerHTML=`「${ef[0]}」の働きをもつ生薬：<b>${r.length}</b>種`;$('#gout2').innerHTML=r.map(herbDet).join('')}};draw()};

// ===== テスト：習得管理・リニューアル（記録はブラウザ内） =====
let QBASE=[],QUN=[];
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
let ST={ok:[],W:[]};
try{const o=JSON.parse(localStorage.getItem('tcmst')||'null');if(o)ST={ok:o.ok||[],W:o.W||[]};else ST.W=JSON.parse(localStorage.getItem('tcmw')||'[]')}catch(e){}
let qlv=0,ren='陰陽',RMSG='';
const save=()=>{try{localStorage.setItem('tcmst',JSON.stringify(ST))}catch(e){}};
const qk=q=>q.t;
const ALLQ=()=>QBASE;
const isOk=q=>ST.ok.includes(qk(q));
const LVN=[['初級','基礎問題4問'],['中級','基礎2問＋難問2問'],['上級','難問4問']];const NBQ=[4,2,0];
const pickQ=u=>{const Q=ALLQ();const sc=x=>u=='*'||x.u==u;const ord=a=>[...shuffle(a.filter(q=>!isOk(q))),...shuffle(a.filter(isOk))];const take=(h,n)=>n?[...ord(Q.filter(q=>q.h==h&&sc(q))),...ord(Q.filter(q=>q.h==h&&!sc(q)))].slice(0,n):[];return shuffle([...take(0,NBQ[qlv]),...take(1,4-NBQ[qlv])])};
const unitStat=u=>{const a=ALLQ().filter(q=>u=='*'||q.u==u);const o=a.filter(isOk).length;return{n:a.length,o,b:a.filter(q=>!q.h).length,h:a.filter(q=>q.h).length,done:a.length>0&&o==a.length}};
const bar=(o,n)=>`<span class='pbar'><i style='width:${n?Math.round(o/n*100):0}%'></i></span>`;
const twoTap=(btn,label,fn)=>{btn.onclick=()=>{if(!btn.dataset.c){btn.dataset.c=1;const t=btn.textContent;btn.textContent=label;setTimeout(()=>{if(btn.isConnected&&btn.dataset.c){delete btn.dataset.c;btn.textContent=t}},4000);return}delete btn.dataset.c;fn()}};
const toRenew=()=>{QUIZ();$('#rnwh').scrollIntoView({block:'start'})};

const renewHTML=()=>{const s=unitStat(ren=='全単元'?'*':ren);return `<h3 id='rnwh'>リニューアル</h3><div class='box' id='rnw'><p class='lead' style='margin:0 0 6px'>全問できた単元は、習得記録をリセットして最初から解き直せます。リセットすると、その単元の問題はすべて未習得に戻ります（復習リストはそのまま残ります）。</p><div class='row sm' id='rnu'>${[...QUN,'全単元'].map(u=>`<button class='chip' data-r='${u}' aria-pressed='${u==ren}'>${unitStat(u=='全単元'?'*':u).done?'✓ ':''}${u}</button>`).join('')}</div><p style='margin:4px 0 8px'><b>${ren}</b>：習得 ${s.o}/${s.n} ${bar(s.o,s.n)}</p><div class='row'><button class='next' id='rrst'>習得記録をリセット</button></div><div id='rmsg'>${RMSG}</div></div>`};

const QUIZ=()=>{const Q=ALLQ();const keys=new Set(Q.map(qk));ST.W=ST.W.filter(k=>keys.has(k));ST.ok=ST.ok.filter(k=>keys.has(k));
const all=unitStat('*'),wn=ST.W.length;
let h=(all.done?`<div class='res' style='border-color:var(--earth)'><b style='font:700 18px var(--hd)'>全${all.n}問を習得しました</b><p style='margin:6px 0 0'>下の「リニューアル」で記録をリセットして、もう一度解き直せます。</p></div>`:'')+
`<div class='box'><b>習得状況</b>　${all.o} / ${all.n}問 ${bar(all.o,all.n)}<div class='lead' style='font-size:12.5px;margin-top:4px'>一度正解すると「習得」、間違えると未習得に戻ります。未習得の問題から優先して出題します。<br>記録はこのブラウザに保存されます（端末ごと。ブラウザの閲覧データを消すと記録も消えます）。</div></div>`+
